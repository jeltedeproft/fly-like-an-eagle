apply plugin: 'war'
apply plugin: 'java'

sourceCompatibility = 11

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion:sources"
    implementation project(path: ':core', configuration: 'archives')
}

configurations { compiler }

dependencies {
    compiler 'org.gwtproject:gwt-dev:2.11.0'
    compiler 'org.gwtproject:gwt-user:2.11.0'
}

tasks.register('dist', JavaExec) {
    dependsOn classes
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = configurations.compiler + sourceSets.main.runtimeClasspath + files(
        sourceSets.main.java.srcDirs,
        sourceSets.main.resources.srcDirs,
        project(':core').sourceSets.main.java.srcDirs,
        project(':core').sourceSets.main.resources.srcDirs
    )

    def distDir = layout.buildDirectory.dir('dist').get().asFile
    def assetsDir = rootProject.file('assets')

    doFirst {
        delete distDir
        copy {
            from 'src/main/webapp'
            into distDir
        }
    }

    args '-war', distDir.absolutePath,
         '-style', 'OBF', '-optimize', '9',
         'com.jeltedeproft.flylikeaneagle.GdxDefinition'

    doLast {
        def deployedAssets = new File(distDir, 'assets')
        deployedAssets.mkdirs()

        if (assetsDir.exists()) {
            copy {
                from assetsDir
                into deployedAssets
                exclude '.gitkeep'
                exclude 'assets.txt'
            }
        }

        // BitmapFont() uses LibGDX's bundled Arial bitmap font. Desktop can read it
        // from the classpath directly, but GWT needs those files in the preload set.
        def gdxJar = configurations.runtimeClasspath.files.find {
            it.name == "gdx-${gdxVersion}.jar"
        }
        if (gdxJar == null) {
            throw new GradleException("Could not locate gdx-${gdxVersion}.jar for web font assets")
        }

        copy {
            from zipTree(gdxJar)
            include 'com/badlogic/gdx/utils/arial-15.fnt'
            include 'com/badlogic/gdx/utils/arial-15.png'
            into deployedAssets
        }

        def marker = new File(deployedAssets, 'README.txt')
        if (!marker.exists()) marker.text = 'Fly Like an Eagle web assets.\n'

        def fontFnt = new File(deployedAssets, 'com/badlogic/gdx/utils/arial-15.fnt')
        def fontPng = new File(deployedAssets, 'com/badlogic/gdx/utils/arial-15.png')
        if (!fontFnt.exists() || !fontPng.exists()) {
            throw new GradleException('LibGDX default bitmap font files were not packaged')
        }

        new File(deployedAssets, 'assets.txt').text =
            "t:README.txt:README.txt:${marker.length()}:text/plain:1\n" +
            "t:com/badlogic/gdx/utils/arial-15.fnt:com/badlogic/gdx/utils/arial-15.fnt:${fontFnt.length()}:text/plain:1\n" +
            "i:com/badlogic/gdx/utils/arial-15.png:com/badlogic/gdx/utils/arial-15.png:${fontPng.length()}:image/png:1\n"
    }
}
