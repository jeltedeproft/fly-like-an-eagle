apply plugin: 'war'
apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-backend-gwt:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion:sources"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion:sources"
    implementation project(path: ':core', configuration: 'archives')
}

configurations { compiler }

dependencies {
    compiler 'org.gwtproject:gwt-dev:2.11.0'
    compiler 'org.gwtproject:gwt-user:2.11.0'
}

tasks.register('dist', JavaExec) {
    dependsOn classes
    mainClass = 'com.google.gwt.dev.Compiler'
    classpath = configurations.compiler + sourceSets.main.runtimeClasspath + files(
        sourceSets.main.java.srcDirs,
        sourceSets.main.resources.srcDirs,
        project(':core').sourceSets.main.java.srcDirs,
        project(':core').sourceSets.main.resources.srcDirs
    )

    def distDir = layout.buildDirectory.dir('dist').get().asFile
    def assetsDir = rootProject.file('assets')

    doFirst {
        delete distDir
        copy {
            from 'src/main/webapp'
            into distDir
        }
    }

    args '-war', distDir.absolutePath,
         '-style', 'OBF', '-optimize', '9',
         'com.jeltedeproft.flylikeaneagle.GdxDefinition'

    doLast {
        def deployedAssets = new File(distDir, 'assets')
        deployedAssets.mkdirs()

        if (assetsDir.exists()) {
            copy {
                from assetsDir
                into deployedAssets
                exclude '.gitkeep'
                exclude 'assets.txt'
            }
        }

        def marker = new File(deployedAssets, 'README.txt')
        if (!marker.exists()) marker.text = 'Fly Like an Eagle web assets.\n'
        def preload = [
            'fly.png',
            'ui-font.png',
            'Pixel Airship/Pixel Airship/10_Backgrounds/BG.png',
            'Pixel Airship/Pixel Airship/10_Backgrounds/Cloud.png',
            'Pixel Airship/Pixel Airship/09_UI/Icons/UI_Icons_Red.png',
            'Pixel Airship/Pixel Airship/09_UI/Ship_Interface/Ship_Interface_UI_Elements.png',
            'Pixel Airship/Pixel Airship/09_UI/Tactical_UI/Tactical_UI_Elements.png',
            'Pixel Airship/Pixel Airship/05_Props/Ship_Props.png',
            'Pixel Airship/Pixel Airship/04_Effects/Fire/Fire.png',
            'Pixel Airship/Pixel Airship/01_Airships/Animated_Airships/AirShip1.png',
            'Pixel Airship/Pixel Airship/01_Airships/Animated_Airships/AirShip5.png',
            'Pixel Airship/Pixel Airship/01_Airships/Animated_Airships/AirShip9.png',
            'aviation-landscape-v2.png'
        ]
        def manifest = "t:README.txt:README.txt:${marker.length()}:text/plain:1\n"
        preload.each { path ->
            def file = new File(deployedAssets, path)
            manifest += "i:${path}:${path}:${file.length()}:image/png:1\n"
        }
        ['fly.atlas','ui-font.fnt'].each { path ->
            def file = new File(deployedAssets, path)
            manifest += "t:${path}:${path}:${file.length()}:text/plain:1\n"
        }
        new File(deployedAssets, 'assets.txt').text = manifest
    }
}
