<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Fly Like an Eagle</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141c29;touch-action:none;font-family:system-ui,sans-serif}
    #embed-html{width:100%;height:100%} canvas{display:block;width:100%!important;height:100%!important}
    #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
    #meters{font-weight:800;font-size:28px} #points{font-weight:700;font-size:16px;text-align:right}
    #result{display:none;position:fixed;top:72px;left:50%;transform:translateX(-50%);min-width:260px;text-align:center;color:white;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:12px 16px;pointer-events:none;text-shadow:0 1px 3px #000}
    #result strong{font-size:26px} #shop{position:fixed;top:168px;left:8px;right:8px;display:none;justify-content:space-around;color:white;text-align:center;font-weight:750;font-size:13px;pointer-events:none;text-shadow:0 1px 3px #000}
    .upgrade{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:9px 8px;min-width:27%}
    .side{position:fixed;bottom:58px;color:rgba(255,255,255,.7);font-weight:800;font-size:18px;pointer-events:none;text-shadow:0 1px 3px #000} #left{left:24px} #right{right:24px}
    #hint{position:fixed;left:10px;right:10px;bottom:14px;text-align:center;color:white;font-weight:650;font-size:13px;pointer-events:none;text-shadow:0 1px 3px #000}
    #error{display:none;position:fixed;inset:12px;z-index:9999;overflow:auto;white-space:pre-wrap;background:rgba(0,0,0,.9);color:#ffb4b4;padding:12px;font:12px/1.4 monospace;border:1px solid #ff6b6b}
  </style>
</head>
<body>
  <div id="embed-html"></div>
  <div id="hud"><div id="meters">0 m</div><div id="points">0 pts<br><span id="best">Best 0 m</span></div></div>
  <div id="result"><strong id="landed">0 m</strong><br><span id="reward">+0 points</span><br><span id="outcome"></span></div>
  <div id="shop">
    <div class="upgrade">⚡ SPEED<br><span id="speed">Lv 0</span></div>
    <div class="upgrade">🪶 GLIDE<br><span id="glide">Lv 0</span></div>
    <div class="upgrade">↻ CONTROL<br><span id="control">Lv 0</span></div>
  </div>
  <div id="left" class="side">↺ HOLD LEFT</div><div id="right" class="side">HOLD RIGHT ↻</div>
  <div id="hint">Distance starts at the ramp lip • land farther to earn more points • after a run tap an upgrade above or tap the bottom half to retry</div>
  <pre id="error"></pre>
  <script>
    (function(){
      var originalTitle='';
      function field(name){var m=document.title.match(new RegExp('(?:^|\\|)'+name+'=([^|]+)'));return m?m[1]:''}
      function upgradeText(value){var p=value.split('/');return p[1]==='MAX'?'Lv '+p[0]+' • MAX':'Lv '+p[0]+' • '+p[1]+' pts'}
      function sync(){
        if(document.title.indexOf('FLYEAGLE|')!==0)return;
        var dist=field('DIST')||'0', land=field('LAND'), best=field('BEST')||'0', pts=field('POINTS')||'0', reward=field('REWARD')||'0', state=field('STATE'), outcome=field('OUTCOME');
        document.getElementById('meters').textContent=dist+' m';
        document.getElementById('points').firstChild.nodeValue=pts+' pts';
        document.getElementById('best').textContent='Best '+best+' m';
        document.getElementById('speed').textContent=upgradeText(field('SPEED'));
        document.getElementById('glide').textContent=upgradeText(field('GLIDE'));
        document.getElementById('control').textContent=upgradeText(field('CONTROL'));
        var finished=state==='RESULT';
        document.getElementById('result').style.display=finished?'block':'none';
        document.getElementById('shop').style.display=finished?'flex':'none';
        if(finished){
          document.getElementById('landed').textContent=(land==='-1'?'0':land)+' m landing';
          document.getElementById('reward').textContent='+'+reward+' points';
          document.getElementById('outcome').textContent=outcome==='CLEAN'?'Clean landing bonus!':outcome==='CRASH'?'Crash landing':'';
        }
      }
      setInterval(sync,100);
      function show(message){var el=document.getElementById('error');el.style.display='block';el.textContent+=(el.textContent?'\n\n':'')+message}
      window.onerror=function(message,source,line,column,error){show('JavaScript error: '+message+'\n'+(source||'')+':'+(line||0)+':'+(column||0)+(error&&error.stack?'\n'+error.stack:''))};
      window.addEventListener('unhandledrejection',function(event){var r=event.reason;show('Unhandled promise rejection: '+(r&&r.stack?r.stack:r))});
    }());
  </script>
  <script type="text/javascript" src="html/html.nocache.js"></script>
</body>
</html>
