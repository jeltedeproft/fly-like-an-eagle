<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Fly Like an Eagle</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141c29;touch-action:none;font-family:system-ui,sans-serif}#embed-html{width:100%;height:100%}canvas{display:block;width:100%!important;height:100%!important}#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}#meters{font-weight:800;font-size:28px}#points{font-weight:700;text-align:right}#result{display:none;position:fixed;top:50px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;background:#0009;border-radius:12px;padding:8px 14px;pointer-events:none}#result strong{font-size:24px}#shop{position:fixed;top:125px;left:6px;right:6px;display:none;grid-template-columns:repeat(4,1fr);gap:5px;color:#fff;text-align:center;font-weight:750;font-size:10px;pointer-events:none}.upgrade,.part{background:#0009;border:1px solid #ffffff55;border-radius:9px;padding:6px 2px}.part{border-color:#ffd76a99;background:#302400c9}.section{grid-column:1/-1;text-align:left;padding-left:4px;color:#fff9;font-size:10px}.side{position:fixed;bottom:55px;color:#fffc;font-weight:800;font-size:17px;pointer-events:none;text-shadow:0 1px 3px #000}#left{left:20px}#right{right:20px}#hint{position:fixed;left:8px;right:8px;bottom:10px;text-align:center;color:#fff;font-weight:650;font-size:12px;pointer-events:none;text-shadow:0 1px 3px #000}#error{display:none;position:fixed;inset:12px;z-index:99;overflow:auto;white-space:pre-wrap;background:#000e;color:#ffb4b4;padding:12px;font:12px monospace}</style></head><body>
<div id="embed-html"></div><div id="hud"><div id="meters">0 m</div><div id="points">0 pts<br><span id="best">Best 0 m</span></div></div><div id="result"><strong id="landed">0 m</strong><br><span id="reward">+0 points</span><br><span id="outcome"></span></div>
<div id="shop"><div class="section">STAT UPGRADES</div><div class="upgrade">⚡ SPEED<br><span id="speed"></span></div><div class="upgrade">🪶 GLIDE<br><span id="glide"></span></div><div class="upgrade">↻ CONTROL<br><span id="control"></span></div><div class="upgrade">🚀 RAMP<br><span id="ramp"></span></div><div class="upgrade">🌬 AERO<br><span id="aero"></span></div><div class="upgrade">⚽ BOUNCE<br><span id="bounce"></span></div><div class="upgrade">🛷 SLIDE<br><span id="slide"></span></div><div></div><div class="section">VEHICLE PARTS</div><div class="part">🪽 WINGS<br><span id="wings"></span></div><div class="part">🛞 SUSPENSION<br><span id="susp"></span></div><div class="part">🧭 TAIL<br><span id="tail"></span></div><div class="part">🔥 BOOSTER<br><span id="booster"></span></div></div>
<div id="left" class="side">↺ HOLD LEFT</div><div id="right" class="side">HOLD RIGHT ↻</div><div id="hint">After stopping: buy stats or permanent vehicle parts • tap the bottom area to launch again</div><pre id="error"></pre>
<script>(function(){function field(n){var m=document.title.match(new RegExp('(?:^|\\|)'+n+'=([^|]+)'));return m?m[1]:''}function ut(v){var p=v.split('/');return p[1]==='MAX'?'Lv '+p[0]+' MAX':'Lv '+p[0]+' • '+p[1]}function pt(v){return v==='OWNED'?'OWNED':v.replace('BUY ','')+' pts'}function sync(){if(document.title.indexOf('FLYEAGLE|')!==0)return;var st=field('STATE'),fin=st==='RESULT',land=field('LAND'),out=field('OUTCOME');document.getElementById('meters').textContent=(field('DIST')||0)+' m';document.getElementById('points').firstChild.nodeValue=(field('POINTS')||0)+' pts';document.getElementById('best').textContent='Best '+(field('BEST')||0)+' m';['speed','glide','control','ramp','aero','bounce','slide'].forEach(function(n){document.getElementById(n).textContent=ut(field(n.toUpperCase()))});document.getElementById('wings').textContent=pt(field('WINGS'));document.getElementById('susp').textContent=pt(field('SUSP'));document.getElementById('tail').textContent=pt(field('TAIL'));document.getElementById('booster').textContent=pt(field('BOOSTER'));document.getElementById('result').style.display=fin?'block':'none';document.getElementById('shop').style.display=fin?'grid':'none';if(fin){document.getElementById('landed').textContent=(land==='-1'?0:land)+' m final distance';document.getElementById('reward').textContent='+'+field('REWARD')+' points';document.getElementById('outcome').textContent=out==='CLEAN'?'Clean landing bonus!':out==='CRASH'?'Crash + slide distance!':''}}setInterval(sync,100);function show(m){var e=document.getElementById('error');e.style.display='block';e.textContent+=m+'\n'}window.onerror=function(m,s,l,c,e){show(m+' '+s+':'+l+':'+c+(e&&e.stack?'\n'+e.stack:''))};window.addEventListener('unhandledrejection',function(e){show('Promise: '+e.reason)})}());</script><script src="html/html.nocache.js"></script></body></html>
