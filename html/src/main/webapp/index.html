<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Fly Like an Eagle</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#141c29; touch-action:none; }
    #embed-html { width:100%; height:100%; }
    canvas { display:block; width:100% !important; height:100% !important; }
    #hint { position:fixed; left:10px; right:10px; bottom:14px; text-align:center; color:white; font:600 14px/1.35 sans-serif; pointer-events:none; text-shadow:0 1px 3px #000; }
    .side { position:fixed; bottom:58px; color:rgba(255,255,255,.65); font:700 18px sans-serif; pointer-events:none; text-shadow:0 1px 3px #000; }
    #left { left:24px; }
    #right { right:24px; }
    #error { display:none; position:fixed; inset:12px; z-index:9999; overflow:auto; white-space:pre-wrap; background:rgba(0,0,0,.9); color:#ffb4b4; padding:12px; font:12px/1.4 monospace; border:1px solid #ff6b6b; }
  </style>
</head>
<body>
  <div id="embed-html"></div>
  <div id="left" class="side">← LEFT</div>
  <div id="right" class="side">RIGHT →</div>
  <div id="hint">Hold left/right to tilt • Match the landing slope for a clean landing • Tap to retry</div>
  <pre id="error"></pre>
  <script>
    (function () {
      function show(message) {
        var el = document.getElementById('error');
        el.style.display = 'block';
        el.textContent += (el.textContent ? '\n\n' : '') + message;
      }
      window.onerror = function (message, source, line, column, error) {
        show('JavaScript error: ' + message + '\n' + (source || '') + ':' + (line || 0) + ':' + (column || 0) + (error && error.stack ? '\n' + error.stack : ''));
      };
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        show('Unhandled promise rejection: ' + (reason && reason.stack ? reason.stack : reason));
      });
    }());
  </script>
  <script type="text/javascript" src="html/html.nocache.js"></script>
</body>
</html>
